<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="config.documentTitle">SubFaber - Configure</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?_cb=__APP_VERSION_QUERY__">
    <link rel="apple-touch-icon" href="/favicon.svg?_cb=__APP_VERSION_QUERY__">
    <script>
        window.__APP_VERSION__ = __APP_VERSION_JSON__;
        window.__CONFIG_LIMITS__ = __CONFIG_LIMITS_JSON__;
    </script>
    <script>
        // FOUC-free theme bootstrap. Preference is one of: light | dark | system.
        // data-theme is always the resolved concrete theme; data-theme-pref mirrors
        // the stored choice so the segmented control can highlight it immediately.
        (function () {
            var html = document.documentElement;
            var pref = 'system';
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'light' || saved === 'dark' || saved === 'system') {
                    pref = saved;
                } else if (saved === 'blackhole' || saved === 'true-dark') {
                    pref = 'dark'; // migrate legacy themes
                }
            } catch (_) { }
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var resolved = pref === 'system' ? (prefersDark ? 'dark' : 'light') : pref;
            html.setAttribute('data-theme', resolved);
            html.setAttribute('data-theme-pref', pref);
        })();
    </script>
    <link rel="stylesheet" href="/css/configure.css?_cb=__APP_VERSION_QUERY__">
    <link rel="stylesheet" href="/css/combobox.css?_cb=__APP_VERSION_QUERY__">
    <link rel="stylesheet" href="/css/quick-setup.css?_cb=__APP_VERSION_QUERY__">
    <!-- SubFaber Modern Minimalist Dashboard theme (must load last to override token layer) -->
    <link rel="stylesheet" href="/css/subfaber-theme.css?_cb=__APP_VERSION_QUERY__">
</head>

<body>
    <!-- ============================================================= -->
    <!-- Top Navigation Bar (sticky, flat, no floating clutter)        -->
    <!-- ============================================================= -->
    <header class="app-navbar" role="banner">
        <div class="app-navbar-inner">
            <div class="app-navbar-brand">
                <img class="app-navbar-logo" src="/logo.png" alt="SubFaber logo" width="28" height="28">
                <span class="app-navbar-name" data-i18n="config.heroTitle">SubFaber</span>
                <span class="app-navbar-version version-badge" id="version-badge" style="display:none;"></span>
            </div>

            <nav class="app-navbar-actions" aria-label="Site controls">
                <!-- Interface language selector (populated dynamically by config.js) -->
                <div class="ui-language-dock" id="uiLanguageDock" role="group" aria-label="UI language"
                    data-i18n="config.uiLanguageAria" data-i18n-attr="aria-label">
                    <div class="ui-language-flag-row" id="uiLanguageFlags">
                        <!-- Flags are rendered dynamically -->
                    </div>
                </div>

                <!-- 3-mode theme switch: Light / System / Dark -->
                <div class="theme-switch" id="themeToggle" role="group" aria-label="Theme"
                    data-i18n="fileUpload.themeToggle" data-i18n-attr="aria-label">
                    <button type="button" class="theme-switch-option" data-theme-choice="light" aria-pressed="false"
                        title="Light" aria-label="Light theme">
                        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4" />
                            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                        </svg>
                    </button>
                    <button type="button" class="theme-switch-option" data-theme-choice="system" aria-pressed="false"
                        title="System" aria-label="Follow system theme">
                        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="12" rx="2" />
                            <path d="M8 20h8M12 16v4" />
                        </svg>
                    </button>
                    <button type="button" class="theme-switch-option" data-theme-choice="dark" aria-pressed="false"
                        title="Dark" aria-label="Dark theme">
                        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                        </svg>
                    </button>
                </div>

                <!-- Documentation / help link -->
                <a class="app-navbar-docs" href="https://github.com/xtremexq/StremioSubMaker#readme" target="_blank"
                    rel="noopener noreferrer" data-i18n="config.quickActionHelp" data-i18n-attr="title,aria-label"
                    title="Help" aria-label="Help">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M9.5 9a2.5 2.5 0 0 1 4.9.6c0 1.7-2.5 2.2-2.5 3.9" />
                        <path d="M12 17h.01" />
                    </svg>
                    <span class="app-navbar-docs-label" data-i18n="config.support.link">Docs</span>
                </a>
            </nav>
        </div>
    </header>

    __CONFIGURE_MAIN_PARTIAL__
    __CONFIGURE_FOOTER_PARTIAL__
    __CONFIGURE_OVERLAYS_PARTIAL__
    __CONFIGURE_QUICK_SETUP_PARTIAL__

    <script src="/js/init.js?_cb=__APP_VERSION_QUERY__" defer></script>
    <script src="/js/combobox.js?_cb=__APP_VERSION_QUERY__" defer></script>
    <script src="/js/combobox-init.js?_cb=__APP_VERSION_QUERY__" defer></script>
    <script src="/js/config-page-state.js?_cb=__APP_VERSION_QUERY__" defer></script>
    <!-- Bulk-key import parser must load before config.js (injected by config-loader.js) -->
    <script src="/js/bulk-key-import.js?_cb=__APP_VERSION_QUERY__" defer></script>
    <script src="/js/config-loader.js?_cb=__APP_VERSION_QUERY__" defer></script>
    <script src="/js/ui-widgets.js?_cb=__APP_VERSION_QUERY__" defer></script>
    <script src="/js/theme-toggle.js?_cb=__APP_VERSION_QUERY__" defer></script>
    <script src="/js/sw-register.js?_cb=__APP_VERSION_QUERY__" defer></script>
    <script src="/js/quick-setup.js?_cb=__APP_VERSION_QUERY__" defer></script>
</body>

</html>
