<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- SubFaber "S" mark — style family: Rootsys "R" mark (rootsys-mark-v2.png)
       DNA: iOS squircle app-icon, bold geometric monogram, 12px stroke,
       horizontal bars + corner curves + 45° blue diagonal leg.
       Exact colors sampled from the original PNG:
         dark navy #1C2734 (1,818 px), blue #0E7CE7 (922 px).
  -->
  <!-- App icon background: white rounded squircle (iOS-style ~28% radius) -->
  <rect x="0" y="0" width="128" height="128" rx="32" ry="32" fill="#FFFFFF"/>

  <!-- ══════════ DARK NAVY "S" BODY (#1C2734) ══════════ -->
  <!-- Top horizontal bar -->
  <path fill="#1C2734" d="M 30 32 H 96 V 44 H 30 Z"/>
  <!-- Upper-left curve (S top bowl — left side going down) -->
  <path fill="#1C2734" d="M 30 32 H 46 V 62 H 36 C 31 62 30 58 30 55 Z"/>
  <!-- Middle horizontal bar -->
  <path fill="#1C2734" d="M 34 58 H 92 V 70 H 34 Z"/>
  <!-- Lower-right curve (S bottom bowl — right side going down) -->
  <path fill="#1C2734" d="M 82 70 H 96 V 100 H 92 C 87 100 82 96 82 91 Z"/>
  <!-- Bottom horizontal bar -->
  <path fill="#1C2734" d="M 30 88 H 96 V 100 H 30 Z"/>

  <!-- ══════════ WHITE NOTCH CUTS (same separators as R) ══════════ -->
  <!-- Cut between top bar and upper-left curve -->
  <path fill="#FFFFFF" d="M 42 32 H 46 V 62 H 42 Z"/>
  <!-- Cut between mid bar and lower-right curve -->
  <path fill="#FFFFFF" d="M 78 70 H 82 V 100 H 78 Z"/>

  <!-- ══════════ BLUE DIAGONAL LEG (#0E7CE7, 45°, same as R) ══════════ -->
  <!-- Blue diagonal leg: from inner-mid of S (center) to lower-right corner,
       matching the R mark's blue leg prominence, angle and weight. -->
  <path fill="#0E7CE7" d="M 52 82 L 90 100 H 68 L 30 82 Z"/>
</svg>
